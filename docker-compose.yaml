x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  plane-web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        VITE_API_BASE_URL: http://localhost:3005
        VITE_WEB_BASE_URL: http://localhost:3005
        VITE_ADMIN_BASE_URL: http://localhost:3005
        VITE_ADMIN_BASE_PATH: ""
        VITE_SPACE_BASE_URL: http://localhost:3005
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: http://localhost:3005
        VITE_LIVE_BASE_PATH: /live
    depends_on:
      plane-api:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks:
      - plane-net

  plane-edge:
    image: nginx:alpine
    depends_on:
      plane-web:
        condition: service_healthy
      plane-api:
        condition: service_healthy
    ports:
      - "3005:80"
    volumes:
      - ./edge.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging: *default-logging
    networks:
      - plane-net

  plane-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    command: /bin/bash -c "export PORT=8000 && export GUNICORN_WORKERS=${GUNICORN_WORKERS:-4} && ./bin/docker-entrypoint-api.sh"
    environment:
      MINIO_EXTERNAL_ENDPOINT_URL: http://localhost:3005/uploads
      UNSPLASH_ACCESS_KEY: ""
      DATABASE_URL: postgresql://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379/0
      CELERY_BROKER_URL: amqp://plane:plane@plane-mq:5672/plane
      CELERY_RESULT_BACKEND: redis://plane-redis:6379/1
      SECRET_KEY: changeme
      ENVIRONMENT: production
      WEB_URL: http://localhost:3005
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:3005
      EMAIL_HOST: smtp.gmail.com
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: plane-uploads
      FILE_SIZE_LIMIT: 5242880
      GUNICORN_WORKERS: 4
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: plane
      RABBITMQ_PASSWORD: plane
      RABBITMQ_VHOST: plane
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-minio:
        condition: service_healthy
      plane-mq:
        condition: service_started
    ports:
      - "3006:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; s=socket.socket(); s.settimeout(3);\ntry: s.connect(('127.0.0.1',8000)); sys.exit(0)\nexcept Exception: sys.exit(1)\nfinally: s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks:
      - plane-net

  plane-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    command: /bin/bash -c "export GUNICORN_WORKERS=${GUNICORN_WORKERS:-2} && ./bin/docker-entrypoint-worker.sh"
    environment:
      MINIO_EXTERNAL_ENDPOINT_URL: http://localhost:3005/uploads
      UNSPLASH_ACCESS_KEY: ""
      DATABASE_URL: postgresql://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379/0
      CELERY_BROKER_URL: amqp://plane:plane@plane-mq:5672/plane
      CELERY_RESULT_BACKEND: redis://plane-redis:6379/1
      SECRET_KEY: changeme
      ENVIRONMENT: production
      WEB_URL: http://localhost:3005
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:3005
      EMAIL_HOST: smtp.gmail.com
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: plane-uploads
      FILE_SIZE_LIMIT: 5242880
      GUNICORN_WORKERS: 2
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: plane
      RABBITMQ_PASSWORD: plane
      RABBITMQ_VHOST: plane
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-minio:
        condition: service_healthy
      plane-mq:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    networks:
      - plane-net

  plane-beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    command: /bin/bash -c "export GUNICORN_WORKERS=${GUNICORN_WORKERS:-2} && ./bin/docker-entrypoint-beat.sh"
    environment:
      MINIO_EXTERNAL_ENDPOINT_URL: http://localhost:3005/uploads
      UNSPLASH_ACCESS_KEY: ""
      DATABASE_URL: postgresql://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379/0
      CELERY_BROKER_URL: amqp://plane:plane@plane-mq:5672/plane
      CELERY_RESULT_BACKEND: redis://plane-redis:6379/1
      SECRET_KEY: changeme
      ENVIRONMENT: production
      WEB_URL: http://localhost:3005
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:3005
      EMAIL_HOST: smtp.gmail.com
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: plane-uploads
      FILE_SIZE_LIMIT: 5242880
      GUNICORN_WORKERS: 2
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: plane
      RABBITMQ_PASSWORD: plane
      RABBITMQ_VHOST: plane
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-minio:
        condition: service_healthy
      plane-mq:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging
    networks:
      - plane-net

  plane-migrator:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    command: /bin/bash -c "./bin/docker-entrypoint-migrator.sh"
    environment:
      MINIO_EXTERNAL_ENDPOINT_URL: http://localhost:3005/uploads
      UNSPLASH_ACCESS_KEY: ""
      DATABASE_URL: postgresql://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379/0
      CELERY_BROKER_URL: amqp://plane:plane@plane-mq:5672/plane
      CELERY_RESULT_BACKEND: redis://plane-redis:6379/1
      SECRET_KEY: changeme
      ENVIRONMENT: production
      WEB_URL: http://localhost:3005
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:3005
      EMAIL_HOST: smtp.gmail.com
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: plane-uploads
      FILE_SIZE_LIMIT: 5242880
      GUNICORN_WORKERS: 2
      RABBITMQ_HOST: plane-mq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: plane
      RABBITMQ_PASSWORD: plane
      RABBITMQ_VHOST: plane
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-minio:
        condition: service_healthy
      plane-mq:
        condition: service_started
    restart: "no"
    logging: *default-logging
    networks:
      - plane-net

  plane-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - plane-net

  plane-redis:
    image: redis:7-alpine
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - plane-net

  plane-minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging: *default-logging
    networks:
      - plane-net

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: plane
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped
    logging: *default-logging
    networks:
      - plane-net

  create-bucket:
    image: minio/mc
    depends_on:
      plane-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set myminio http://plane-minio:9000 minioadmin minioadmin;
        /usr/bin/mc mb --ignore-existing myminio/plane-uploads;
        /usr/bin/mc anonymous set public myminio/plane-uploads;
        exit 0;
      "
    restart: on-failure
    logging: *default-logging
    networks:
      - plane-net

  db-backup:
    image: postgres:15-alpine
    depends_on:
      plane-db:
        condition: service_healthy
    environment:
      PGPASSWORD: plane
    entrypoint: /bin/sh -c "while true; do pg_dump -h plane-db -U plane plane > /backups/plane-$(date +%Y%m%d-%H%M%S).sql; sleep ${BACKUP_INTERVAL:-86400}; done"
    volumes:
      - ./data/backups/db:/backups
    restart: unless-stopped
    logging: *default-logging
    networks:
      - plane-net

  minio-backup:
    image: minio/mc
    depends_on:
      plane-minio:
        condition: service_healthy
    entrypoint: /bin/sh -c "while true; do /usr/bin/mc alias set myminio http://plane-minio:9000 minioadmin minioadmin && /usr/bin/mc mirror myminio/plane-uploads /backups/plane-uploads && sleep ${BACKUP_INTERVAL:-86400}; done"
    volumes:
      - ./data/backups/minio:/backups
    restart: unless-stopped
    logging: *default-logging
    networks:
      - plane-net

networks:
  plane-net:
    driver: bridge