
services:
  # 1. THE GATEWAY (Cloudflare Tunnel)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: plane-tunnel
    restart: unless-stopped
    command: tunnel run --token docker run cloudflare/cloudflared:latest tunnel --no-autoupdate run --token eyJhIjoiY2NmMDYwMDkwNDliMTA0YjY4MzBiOTY4ZTkyM2UwMjAiLCJ0IjoiYzhjZGQ5YWMtOTYwZC00MDFhLTlhODktNWRiNzE1NTA4N2MzIiwicyI6Ik5URmpPRFkyTnpRdFlUQTFZaTAwTkRKakxXRXpNbVF0WWpFek1tRXpZVEF6T1RWbSJ9
    networks:
      - plane-net
    deploy:
      resources:
        limits:
          memory: 128M

  # 2. THE FRONTEND (Web)
  plane-web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        # POINT THESE TO YOUR PUBLIC DOMAIN
        VITE_API_BASE_URL: "https://plane.abishek.pro/api"
        VITE_WEB_BASE_URL: "https://plane.abishek.pro"
        VITE_SPACE_BASE_URL: "https://plane.abishek.pro/spaces"
        VITE_LIVE_BASE_URL: "https://plane.abishek.pro/live"
        VITE_ADMIN_BASE_URL: "https://plane.abishek.pro"
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_healthy
    networks:
      - plane-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # 3. THE BACKEND (API)
  plane-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    command: /bin/bash -c "export PORT=8000 && python manage.py migrate && ./bin/docker-entrypoint-api.sh"
    environment:
      # CRITICAL: Point to public domain
      WEB_URL: "https://plane.abishek.pro"
      CORS_ALLOWED_ORIGINS: "https://plane.abishek.pro"
      # Database & Services
      DATABASE_URL: postgresql://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379/0
      CELERY_BROKER_URL: amqp://plane:plane@plane-mq:5672/plane
      CELERY_RESULT_BACKEND: redis://plane-redis:6379/1
      MINIO_EXTERNAL_ENDPOINT_URL: "https://plane.abishek.pro/uploads"
      # Internal Minio (Docker-to-Docker)
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_S3_BUCKET_NAME: plane-uploads
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      FILE_SIZE_LIMIT: 5242880
      SECRET_KEY: "replace-this-with-random-text"
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_started
    networks:
      - plane-net
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 800M

  # 4. BACKGROUND WORKERS (Consolidated)
  plane-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    command: /bin/bash -c "./bin/docker-entrypoint-worker.sh"
    environment:
      # Copy all envs from plane-api above (Database, Redis, etc.)
      DATABASE_URL: postgresql://plane:plane@plane-db:5432/plane
      REDIS_URL: redis://plane-redis:6379/0
      CELERY_BROKER_URL: amqp://plane:plane@plane-mq:5672/plane
      CELERY_RESULT_BACKEND: redis://plane-redis:6379/1
      AWS_S3_ENDPOINT_URL: http://plane-minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_S3_BUCKET_NAME: plane-uploads
      SECRET_KEY: "replace-this-with-random-text"
    depends_on:
      plane-api:
        condition: service_started
    networks:
      - plane-net
    deploy:
      resources:
        limits:
          memory: 512M

  # 5. DATA STORES (Infrastructure)
  plane-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - plane-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane"]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  plane-redis:
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    networks:
      - plane-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  plane-mq:
    image: rabbitmq:3.13-management-alpine # Use specific version for stability
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: plane
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - plane-net
    deploy:
      resources:
        limits:
          memory: 300M # Strictly capped!

  plane-minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data/minio:/data
    networks:
      - plane-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # Run this ONCE manually if buckets don't exist, then comment out
  create-bucket:
    image: minio/mc
    depends_on:
      plane-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set myminio http://plane-minio:9000 minioadmin minioadmin;
        /usr/bin/mc mb --ignore-existing myminio/plane-uploads;
        /usr/bin/mc anonymous set public myminio/plane-uploads;
        exit 0;
      "
    networks:
      - plane-net

networks:
  plane-net:
    driver: bridge