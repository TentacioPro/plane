server {
  listen 80;
  server_name _;
  
  # Resolve Docker service names at runtime (prevents stale upstream IPs after restart)
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api_upstream plane-api;
  set $web_upstream plane-web;

  # Proxy API requests to backend
  location /api/ {
    proxy_pass http://$api_upstream:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy auth (login/signup/csrf) to backend
  location /auth/ {
    proxy_pass http://$api_upstream:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy live collaboration WebSocket
  location /live/ {
    proxy_pass http://$api_upstream:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
  }

  # Proxy MinIO storage for file access
  location /uploads/ {
    rewrite ^/uploads/(.*)$ /$1 break;
    proxy_pass http://plane-minio:9000;
    proxy_set_header Host plane-minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Allow large file uploads
    client_max_body_size 100M;
    # Disable buffering for large files
    proxy_buffering off;
  }

  # Serve Next.js app
  location / {
    proxy_pass http://$web_upstream:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
